name: '复制构建文件到发布目录'
description: '将Tauri构建文件复制到带版本号的发布目录'
inputs:
  source-dir:
    description: '包含打包文件的源目录'
    required: false
    default: 'src-tauri/target/release/bundle/'
  target-root:
    description: '发布文件的目标根目录'
    required: false
    default: 'src-tauri/target/release/fabu/'
  config-file:
    description: 'tauri.conf.json 文件的路径'
    required: false
    default: 'src-tauri/tauri.conf.json'

outputs:
  version:
    description: '从配置文件中提取的应用版本'
    value: ${{ steps.extract-version.outputs.version }}
  target-dir:
    description: '带版本号的目标目录完整路径'
    value: ${{ steps.create-target-dir.outputs.target_dir }}

runs:
  using: 'node16'
  main: 'dist/index.js'